# Contribution-grid snake — generates github-contribution-grid-snake.svg/.gif
# and pushes them to the `output` branch. Referenced in README.md.
name: generate-snake

on:
  schedule:
    # every day at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: GlorysID
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#ffcb05
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
